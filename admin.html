<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - لعبة المسابقات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: white; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; }
        .category-box { background: #1e293b; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #334155; }
        input, textarea, button { padding: 8px; margin: 5px; border-radius: 4px; border: none; }
        input, textarea { background: #334155; color: white; }
        input[type="text"], input[type="url"] { width: 60%; }
        button { background: #0284c7; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0369a1; }
        .danger-btn { background: #ef4444; }
        .danger-btn:hover { background: #dc2626; }
        .success-btn { background: #22c55e; }
        .success-btn:hover { background: #16a34a; }
        .nav-links { text-align: center; margin-bottom: 20px; }
        .nav-links a { color: #38bdf8; text-decoration: none; font-size: 18px; margin: 0 10px; }
        .question-row { background: #0f172a; padding: 10px; margin-top: 10px; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .cat-header-inputs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .preview-img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="nav-links">
        <a href="index.html">🎮 الانتقال للعبة الرئيسية</a>
    </div>

    <h1>لوحة التحكم وتعديل الأسئلة والأقسام</h1>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <button class="success-btn" onclick="addNewCategory()" style="font-size: 16px; padding: 10px 20px;">➕ إضافة قسم جديد</button>
    </div>

    <div id="editor-container"></div>

    <button onclick="saveChanges()" class="success-btn" style="font-size: 18px; padding: 12px 24px; display: block; margin: 20px auto;">حفظ كافة التغييرات 💾</button>

    <script src="questions.js"></script>
    <script>
        let data = getGameData();

        function renderEditor() {
            let container = document.getElementById('editor-container');
            container.innerHTML = '';

            data.categories.forEach((cat, cIndex) => {
                let catDiv = document.createElement('div');
                catDiv.className = 'category-box';
                
                let imgPreview = cat.image ? `<img src="${cat.image}" class="preview-img">` : '';

                let html = `
                    <div class="cat-header-inputs">
                        <h3>
                            ${imgPreview}
                            القسم ${cIndex + 1}: 
                            <input type="text" id="cat-name-${cIndex}" value="${cat.name}" placeholder="اسم القسم">
                            <button class="danger-btn" onclick="deleteCategory(${cIndex})">حذف القسم 🗑️</button>
                        </h3>
                        <div>
                            <label>صورة القسم (رابط URL):</label>
                            <input type="url" id="cat-img-${cIndex}" value="${cat.image || ''}" placeholder="https://example.com/image.png">
                            <input type="file" accept="image/*" onchange="handleImageUpload(event, ${cIndex})" style="color: #cbd5e1;">
                        </div>
                    </div>
                    <hr style="border-color: #334155;">
                    <h4>الأسئلة:</h4>
                    <div id="questions-list-${cIndex}">
                `;

                cat.questions.forEach((q, qIndex) => {
                    html += `
                        <div class="question-row">
                            <label>النقاط:</label>
                            <input type="number" id="q-pts-${cIndex}-${qIndex}" value="${q.points}" style="width: 70px;">
                            <label>السؤال:</label>
                            <input type="text" id="q-text-${cIndex}-${qIndex}" value="${q.q}" style="width: 35%;">
                            <label>الجواب:</label>
                            <input type="text" id="q-ans-${cIndex}-${qIndex}" value="${q.a}" style="width: 25%;">
                            <button class="danger-btn" onclick="deleteQuestion(${cIndex}, ${qIndex})">حذف</button>
                        </div>
                    `;
                });

                html += `
                    </div>
                    <button onclick="addNewQuestion(${cIndex})" style="margin-top: 10px;">➕ إضافة سؤال لهذا القسم</button>
                `;

                catDiv.innerHTML = html;
                container.appendChild(catDiv);
            });
        }

        // Handle local image file upload and convert to Base64 string
        function handleImageUpload(event, cIndex) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(`cat-img-${cIndex}`).value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function addNewCategory() {
            syncDataFromDOM();
            data.categories.push({
                name: "قسم جديد",
                image: "",
                questions: [
                    { points: 300, q: "اكتب السؤال هنا؟", a: "الاجابة هنا" }
                ]
            });
            renderEditor();
        }

        function deleteCategory(cIndex) {
            if (confirm("هل أنت متأكد من حذف هذا القسم بكامل أسئلته؟")) {
                syncDataFromDOM();
                data.categories.splice(cIndex, 1);
                renderEditor();
            }
        }

        function addNewQuestion(cIndex) {
            syncDataFromDOM();
            data.categories[cIndex].questions.push({
                points: 300,
                q: "",
                a: ""
            });
            renderEditor();
        }

        function deleteQuestion(cIndex, qIndex) {
            syncDataFromDOM();
            data.categories[cIndex].questions.splice(qIndex, 1);
            renderEditor();
        }

        // Pull active inputs back into data array before modifying structure
        function syncDataFromDOM() {
            data.categories.forEach((cat, cIndex) => {
                let nameInput = document.getElementById(`cat-name-${cIndex}`);
                let imgInput = document.getElementById(`cat-img-${cIndex}`);
                if (nameInput) cat.name = nameInput.value;
                if (imgInput) cat.image = imgInput.value;

                cat.questions.forEach((q, qIndex) => {
                    let pts = document.getElementById(`q-pts-${cIndex}-${qIndex}`);
                    let qText = document.getElementById(`q-text-${cIndex}-${qIndex}`);
                    let qAns = document.getElementById(`q-ans-${cIndex}-${qIndex}`);
                    
                    if (pts) q.points = parseInt(pts.value) || 0;
                    if (qText) q.q = qText.value;
                    if (qAns) q.a = qAns.value;
                });
            });
        }

        function saveChanges() {
            syncDataFromDOM();
            localStorage.setItem('trivia_game_data', JSON.stringify(data));
            alert('تم حفظ التغييرات بنجاح! يمكنك الانتقال للعبة الآن.');
            renderEditor();
        }

        renderEditor();
    </script>
</body>
</html>
